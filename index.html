<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Snake</title>
<style>
  :root {
    --bg-0: #070b16;
    --bg-1: #0e1428;
    --ink: #e8f0ff;
    --muted: #8aa0c8;
    --cyan: #34e5ff;
    --blue: #5b8cff;
    --mint: #7cf6d0;
    --food: #ff4d6d;
    --gold: #ffd23f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 800px at 50% -10%, rgba(52,229,255,0.10) 0, transparent 60%),
      radial-gradient(900px 600px at 15% 110%, rgba(91,140,255,0.18), transparent 55%),
      radial-gradient(900px 600px at 85% 110%, rgba(255,77,109,0.14), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    color: var(--ink);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 18px;
    gap: 16px;
    overflow: hidden;
  }

  .title {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 0 18px rgba(52,229,255,0.55), 0 0 40px rgba(91,140,255,0.35);
  }
  .title b { color: var(--cyan); }
  .title i { color: var(--food); font-style: normal; }

  .hud {
    display: flex;
    gap: 10px;
    width: min(92vw, 460px);
  }
  .chip {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(140,170,255,0.16);
    border-radius: 14px;
    padding: 8px 12px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .chip .label {
    font-size: 0.62rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .chip .value {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--mint);
    text-shadow: 0 0 14px rgba(124,246,208,0.5);
  }
  .chip.best .value { color: var(--gold); text-shadow: 0 0 14px rgba(255,210,63,0.5); }
  .chip.level .value { color: var(--blue); text-shadow: 0 0 14px rgba(91,140,255,0.5); }

  .stage {
    position: relative;
    width: min(92vw, 460px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    padding: 14px;
    background: rgba(10,16,32,0.6);
    border: 1px solid rgba(140,170,255,0.18);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      inset 0 0 60px rgba(52,229,255,0.06);
    backdrop-filter: blur(4px);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    background: radial-gradient(120% 120% at 50% 0%, #0c1327, #070b16);
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 14px;
    border-radius: 12px;
    background: rgba(7,11,22,0.72);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 {
    margin: 0;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(52,229,255,0.5);
  }
  .overlay p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 280px; line-height: 1.5; }

  button.play {
    font: inherit;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #05121a;
    background: linear-gradient(135deg, var(--mint), var(--cyan));
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    cursor: pointer;
    box-shadow: 0 0 28px rgba(52,229,255,0.5);
    transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  button.play:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 40px rgba(52,229,255,0.7); }
  button.play:active { transform: scale(0.96); }

  .toolbar {
    position: absolute;
    top: 22px;
    right: 22px;
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(140,170,255,0.2);
    background: rgba(255,255,255,0.05);
    color: var(--ink);
    font-size: 1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.12); }
  .icon-btn:active { transform: scale(0.9); }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 8px;
    margin-top: 2px;
  }
  .dpad button {
    border: 1px solid rgba(140,170,255,0.22);
    background: rgba(255,255,255,0.05);
    color: var(--cyan);
    font-size: 1.4rem;
    border-radius: 14px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .dpad button:active { transform: scale(0.9); background: rgba(52,229,255,0.18); }
  .dpad .up { grid-area: 1 / 2; }
  .dpad .left { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down { grid-area: 3 / 2; }
  .dpad .center {
    grid-area: 2 / 2;
    border: none;
    background: transparent;
    pointer-events: none;
  }

  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    max-width: 340px;
    line-height: 1.5;
  }
  .hint kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(140,170,255,0.2);
    border-radius: 5px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.75rem;
  }

  @media (max-width: 520px) {
    body { justify-content: flex-start; padding-top: 24px; }
    .toolbar { top: 30px; right: 30px; }
  }
  @media (hover: none) and (pointer: fine), (pointer: coarse) {
    .dpad { display: grid; }
  }
  @media (min-width: 700px) {
    .dpad { display: none; }
  }
</style>
</head>
<body>
  <h1 class="title"><b>Neon</b>&nbsp;Snake<i>_</i></h1>

  <div class="hud">
    <div class="chip"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="chip level"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="chip best"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>

  <div class="stage">
    <div class="toolbar">
      <button class="icon-btn" id="sound-btn" title="Toggle sound" aria-label="Toggle sound">&#128266;</button>
      <button class="icon-btn" id="pause-btn" title="Pause" aria-label="Pause">&#10073;&#10073;</button>
    </div>
    <canvas id="board" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Neon Snake</h2>
      <p id="overlay-text">Eat the glowing fruit. Grab the gold ones fast for bonus points. Don't hit the walls or yourself.</p>
      <button type="button" class="play" id="start-btn">Play</button>
    </div>
  </div>

  <div class="dpad" aria-hidden="true">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <span class="center"></span>
    <button class="right" data-dir="right">&#9654;</button>
    <button class="down" data-dir="down">&#9660;</button>
  </div>

  <p class="hint">
    <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer &nbsp;&bull;&nbsp; <kbd>Space</kbd> to pause &nbsp;&bull;&nbsp; swipe on touch
  </p>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  var scoreEl = document.getElementById("score");
  var levelEl = document.getElementById("level");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayText = document.getElementById("overlay-text");
  var startBtn = document.getElementById("start-btn");
  var pauseBtn = document.getElementById("pause-btn");
  var soundBtn = document.getElementById("sound-btn");

  var CELLS = 20;
  var CELL = W / CELLS;
  var BASE_STEP = 145;
  var MIN_STEP = 68;

  var snake, prevSnake, dir, nextDir, dirQueue;
  var food, bonus;
  var score, best, running, paused, dead;
  var stepMs, lastTick, level;
  var combo, comboTimer;

  var particles = [];
  var floaters = [];
  var pulses = [];
  var shake = 0;
  var deathFlash = 0;

  best = Number(localStorage.getItem("neon-snake-best") || 0);
  bestEl.textContent = best;

  /* ---------- audio ---------- */
  var audioOn = localStorage.getItem("neon-snake-sound") !== "off";
  var actx = null;
  updateSoundIcon();

  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { actx = null; }
    }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (!audioOn || !actx) return;
    var t0 = actx.currentTime;
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sfxEat()   { beep(440, 0.12, "square", 0.10, 880); }
  function sfxBonus() { beep(520, 0.09, "square", 0.10, 780); setTimeout(function(){ beep(780, 0.12, "square", 0.10, 1200); }, 90); }
  function sfxTurn()  { beep(240, 0.04, "sine", 0.04); }
  function sfxDie()   { beep(320, 0.5, "sawtooth", 0.14, 60); }

  function updateSoundIcon() {
    soundBtn.innerHTML = audioOn ? "&#128266;" : "&#128263;";
  }

  /* ---------- game setup ---------- */
  function reset() {
    snake = [ {x:8,y:10}, {x:7,y:10}, {x:6,y:10}, {x:5,y:10} ];
    prevSnake = snake.map(function (s) { return {x:s.x, y:s.y}; });
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
    dirQueue = [];
    score = 0;
    level = 1;
    stepMs = BASE_STEP;
    combo = 0;
    comboTimer = 0;
    bonus = null;
    dead = false;
    particles.length = 0;
    floaters.length = 0;
    pulses.length = 0;
    shake = 0;
    deathFlash = 0;
    scoreEl.textContent = "0";
    levelEl.textContent = "1";
    placeFood();
  }

  function emptyCell() {
    var p;
    do {
      p = { x: (Math.random() * CELLS) | 0, y: (Math.random() * CELLS) | 0 };
    } while (
      snake.some(function (s) { return s.x === p.x && s.y === p.y; }) ||
      (food && food.x === p.x && food.y === p.y) ||
      (bonus && bonus.x === p.x && bonus.y === p.y)
    );
    return p;
  }

  function placeFood() {
    food = emptyCell();
    food.born = performance.now();
  }

  function maybeSpawnBonus() {
    if (bonus || Math.random() > 0.28) return;
    bonus = emptyCell();
    bonus.born = performance.now();
    bonus.life = 6500;
  }

  /* ---------- flow ---------- */
  function startGame() {
    ensureAudio();
    reset();
    running = true;
    paused = false;
    dead = false;
    overlay.classList.add("hidden");
    lastTick = performance.now();
  }

  function endGame() {
    running = false;
    dead = true;
    deathFlash = 1;
    shake = 16;
    sfxDie();
    var head = snake[0];
    burst(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, 46, "#7cf6d0", 5);
    burst(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, 26, "#34e5ff", 3);
    if (score > best) {
      best = score;
      localStorage.setItem("neon-snake-best", String(best));
      bestEl.textContent = best;
    }
    setTimeout(function () {
      overlayTitle.textContent = "Game Over";
      overlayText.textContent = "You scored " + score + " and reached level " + level + ". " +
        (score >= best && score > 0 ? "New personal best!" : "Go again?");
      startBtn.textContent = "Play Again";
      overlay.classList.remove("hidden");
    }, 550);
  }

  function togglePause(force) {
    if (!running) return;
    paused = (force === undefined) ? !paused : force;
    if (paused) {
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Catch your breath.";
      startBtn.textContent = "Resume";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
      lastTick = performance.now();
    }
  }

  /* ---------- simulation ---------- */
  function tick() {
    if (dirQueue.length) {
      var nd = dirQueue.shift();
      if (!(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
    }
    dir = nextDir;

    prevSnake = snake.map(function (s) { return {x:s.x, y:s.y}; });

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some(function (s, i) { return i < snake.length - 1 && s.x === head.x && s.y === head.y; })
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    var cx = head.x * CELL + CELL / 2;
    var cy = head.y * CELL + CELL / 2;

    if (bonus && head.x === bonus.x && head.y === bonus.y) {
      var elapsed = performance.now() - bonus.born;
      var quick = Math.max(1, Math.round(5 * (1 - elapsed / bonus.life)));
      var gain = 3 + quick;
      score += gain;
      addFloater(cx, cy, "+" + gain, "#ffd23f");
      burst(cx, cy, 30, "#ffd23f", 4);
      pulses.push({ x: cx, y: cy, r: 4, max: CELL * 5, life: 1, color: "255,210,63" });
      shake = Math.max(shake, 8);
      sfxBonus();
      bonus = null;
      bumpCombo(cx, cy);
      afterScore();
    } else if (head.x === food.x && head.y === food.y) {
      score += 1;
      addFloater(cx, cy, "+1", "#ff8fa3");
      burst(cx, cy, 18, "#ff4d6d", 3.2);
      pulses.push({ x: cx, y: cy, r: 4, max: CELL * 3.4, life: 1, color: "255,77,109" });
      sfxEat();
      placeFood();
      maybeSpawnBonus();
      bumpCombo(cx, cy);
      afterScore();
    } else {
      snake.pop();
    }
  }

  function bumpCombo(cx, cy) {
    if (comboTimer > 0) {
      combo += 1;
      if (combo >= 2) {
        var b = combo;
        score += b;
        addFloater(cx, cy - 16, "COMBO x" + combo + "  +" + b, "#7cf6d0");
      }
    } else {
      combo = 1;
    }
    comboTimer = 2600;
  }

  function afterScore() {
    scoreEl.textContent = score;
    var newLevel = 1 + Math.floor(score / 5);
    if (newLevel !== level) {
      level = newLevel;
      levelEl.textContent = level;
      stepMs = Math.max(MIN_STEP, BASE_STEP - (level - 1) * 8);
      addFloater(W / 2, 26, "LEVEL " + level, "#5b8cff");
      pulses.push({ x: W / 2, y: H / 2, r: 4, max: W, life: 1, color: "91,140,255" });
    }
  }

  /* ---------- effects ---------- */
  function burst(x, y, n, color, speed) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = (0.4 + Math.random()) * (speed || 3);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        decay: 0.012 + Math.random() * 0.03,
        size: 1 + Math.random() * 3.2,
        color: color
      });
    }
  }
  function addFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color, life: 1, vy: -0.6 });
  }
  function stepEffects(dt) {
    var f = dt / 16.6667;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.vx *= 0.94;
      p.vy = p.vy * 0.94 + 0.06 * f;
      p.life -= p.decay * f;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = floaters.length - 1; j >= 0; j--) {
      var fl = floaters[j];
      fl.y += fl.vy * f;
      fl.vy *= 0.98;
      fl.life -= 0.014 * f;
      if (fl.life <= 0) floaters.splice(j, 1);
    }
    for (var k = pulses.length - 1; k >= 0; k--) {
      var pu = pulses[k];
      pu.r += (pu.max - pu.r) * 0.08 * f;
      pu.life -= 0.03 * f;
      if (pu.life <= 0) pulses.splice(k, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - 0.6 * f);
    if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - 0.03 * f);
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }
  }

  /* ---------- render ---------- */
  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawGrid(now) {
    ctx.save();
    ctx.strokeStyle = "rgba(120,160,255,0.06)";
    ctx.lineWidth = 1;
    for (var i = 1; i < CELLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
    }
    // moving glow band
    var band = (now / 24) % (H + 200) - 100;
    var g = ctx.createLinearGradient(0, band - 90, 0, band + 90);
    g.addColorStop(0, "rgba(52,229,255,0)");
    g.addColorStop(0.5, "rgba(52,229,255,0.05)");
    g.addColorStop(1, "rgba(52,229,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, band - 90, W, 180);
    ctx.restore();
  }

  function drawFood(now) {
    var cx = food.x * CELL + CELL / 2;
    var cy = food.y * CELL + CELL / 2;
    var pulse = 1 + Math.sin(now / 180) * 0.12;
    var r = CELL * 0.30 * pulse;

    ctx.save();
    ctx.shadowColor = "rgba(255,77,109,0.9)";
    ctx.shadowBlur = 22;
    var grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.2, cx, cy, r);
    grad.addColorStop(0, "#ff9db0");
    grad.addColorStop(1, "#ff2d55");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // sparkle
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;
    var sp = (now / 400);
    var sr = r * 1.7;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(sp);
    ctx.beginPath();
    ctx.moveTo(-sr, 0); ctx.lineTo(sr, 0);
    ctx.moveTo(0, -sr); ctx.lineTo(0, sr);
    ctx.globalAlpha = 0.5 + Math.sin(now / 150) * 0.3;
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function drawBonus(now) {
    if (!bonus) return;
    var age = now - bonus.born;
    var left = 1 - age / bonus.life;
    if (left <= 0) { bonus = null; return; }
    var cx = bonus.x * CELL + CELL / 2;
    var cy = bonus.y * CELL + CELL / 2;
    var pulse = 1 + Math.sin(now / 90) * 0.16;
    var r = CELL * 0.34 * pulse;

    ctx.save();
    // countdown ring
    ctx.strokeStyle = "rgba(255,210,63,0.35)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.5, -Math.PI / 2, -Math.PI / 2 + left * Math.PI * 2);
    ctx.stroke();

    ctx.shadowColor = "rgba(255,210,63,0.95)";
    ctx.shadowBlur = 26;
    var grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.2, cx, cy, r);
    grad.addColorStop(0, "#fff3c4");
    grad.addColorStop(1, "#ffb300");
    ctx.fillStyle = grad;
    // diamond
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4 + now / 600);
    ctx.fillRect(-r * 0.72, -r * 0.72, r * 1.44, r * 1.44);
    ctx.restore();
  }

  function drawSnake(alpha, now) {
    var pts = [];
    for (var i = 0; i < snake.length; i++) {
      var cur = snake[i];
      var src = prevSnake[i] || cur;
      pts.push({
        x: lerp(src.x, cur.x, alpha) * CELL + CELL / 2,
        y: lerp(src.y, cur.y, alpha) * CELL + CELL / 2
      });
    }
    if (pts.length < 2) return;

    // glow pass
    ctx.save();
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(52,229,255,0.8)";
    ctx.shadowBlur = 24;
    ctx.strokeStyle = "rgba(52,229,255,0.35)";
    ctx.lineWidth = CELL * 0.92;
    strokePath(pts);
    ctx.restore();

    // body gradient pass
    ctx.save();
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    var grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
    grad.addColorStop(0, "#7cf6d0");
    grad.addColorStop(0.5, "#34e5ff");
    grad.addColorStop(1, "#5b8cff");
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL * 0.72;
    strokePath(pts);

    // inner highlight
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = CELL * 0.28;
    strokePath(pts);
    ctx.restore();

    // head
    var h = pts[0];
    var hd = dir;
    ctx.save();
    ctx.shadowColor = "rgba(124,246,208,0.9)";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#9dfbe0";
    ctx.beginPath();
    ctx.arc(h.x, h.y, CELL * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // eyes
    var ex = hd.x, ey = hd.y;
    if (ex === 0 && ey === 0) { ex = 1; }
    var perpX = -ey, perpY = ex;
    var off = CELL * 0.16;
    var fwd = CELL * 0.12;
    for (var s = -1; s <= 1; s += 2) {
      var eyeX = h.x + ex * fwd + perpX * off * s;
      var eyeY = h.y + ey * fwd + perpY * off * s;
      ctx.fillStyle = "#05121a";
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, CELL * 0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath();
      ctx.arc(eyeX - 1, eyeY - 1, CELL * 0.035, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function strokePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawEffects() {
    for (var i = 0; i < pulses.length; i++) {
      var pu = pulses[i];
      ctx.strokeStyle = "rgba(" + pu.color + "," + (pu.life * 0.5) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(pu.x, pu.y, pu.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.font = "700 15px 'Segoe UI', sans-serif";
    for (var k = 0; k < floaters.length; k++) {
      var fl = floaters[k];
      ctx.globalAlpha = Math.max(0, Math.min(1, fl.life * 1.4));
      ctx.fillStyle = fl.color;
      ctx.shadowColor = fl.color;
      ctx.shadowBlur = 10;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function draw(alpha, now) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawGrid(now);
    drawFood(now);
    drawBonus(now);
    if (snake) drawSnake(dead ? 1 : alpha, now);
    drawEffects();

    ctx.restore();

    if (deathFlash > 0) {
      ctx.fillStyle = "rgba(255,77,109," + (deathFlash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    // combo meter
    if (running && !paused && combo >= 2 && comboTimer > 0) {
      var w = (comboTimer / 2600) * (W - 40);
      ctx.fillStyle = "rgba(124,246,208,0.25)";
      ctx.fillRect(20, H - 14, W - 40, 5);
      ctx.fillStyle = "#7cf6d0";
      ctx.fillRect(20, H - 14, w, 5);
    }
  }

  /* ---------- main loop ---------- */
  var lastFrame = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(50, now - lastFrame);
    lastFrame = now;

    if (running && !paused) {
      // if the loop stalled (tab backgrounded, heavy hitch), resync instead of
      // fast-forwarding dozens of moves and killing the snake
      if (now - lastTick > stepMs * 4) lastTick = now - stepMs;
      var steps = 0;
      while (now - lastTick >= stepMs && steps < 4) {
        lastTick += stepMs;
        steps++;
        tick();
        if (!running) break;
      }
    }
    stepEffects(dt);

    var alpha = (running && !paused) ? Math.min(1, (now - lastTick) / stepMs) : 1;
    draw(alpha, now);
  }
  requestAnimationFrame(frame);

  /* ---------- input ---------- */
  function queueDir(x, y) {
    var last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (x === last.x && y === last.y) return;
    if (x === -last.x && y === -last.y) return;
    if (dirQueue.length < 2) dirQueue.push({ x: x, y: y });
    sfxTurn();
  }

  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k) !== -1) e.preventDefault();
    if (k === "arrowup" || k === "w") { ensureAudio(); queueDir(0, -1); }
    else if (k === "arrowdown" || k === "s") { ensureAudio(); queueDir(0, 1); }
    else if (k === "arrowleft" || k === "a") { ensureAudio(); queueDir(-1, 0); }
    else if (k === "arrowright" || k === "d") { ensureAudio(); queueDir(1, 0); }
    else if (k === " ") { if (running) togglePause(); else startGame(); }
  });

  var dirMap = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
  document.querySelectorAll(".dpad button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var d = dirMap[btn.dataset.dir];
      if (!running) startGame();
      ensureAudio();
      queueDir(d[0], d[1]);
    });
  });

  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
      if (!running) startGame();
      return;
    }
    ensureAudio();
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
    else queueDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  startBtn.addEventListener("click", function () {
    if (paused) togglePause(false);
    else startGame();
  });
  pauseBtn.addEventListener("click", function () { togglePause(); });
  soundBtn.addEventListener("click", function () {
    audioOn = !audioOn;
    localStorage.setItem("neon-snake-sound", audioOn ? "on" : "off");
    updateSoundIcon();
    if (audioOn) { ensureAudio(); sfxEat(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && running && !paused) togglePause(true);
    else if (!document.hidden) { lastTick = performance.now(); lastFrame = lastTick; }
  });

  /* ---------- first paint ---------- */
  reset();
  running = false;
})();
</script>
</body>
</html>
