<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake</title>
<style>
  :root {
    --bg: #f4f7f5;
    --panel: #ffffff;
    --ink: #2f3e46;
    --accent: #4caf50;
    --accent-dark: #388e3c;
    --food: #ef5350;
    --grid: #e7efe9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 16px;
    gap: 14px;
  }
  h1 {
    margin: 0;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  h1 .dot { color: var(--accent); }
  .scoreboard {
    display: flex;
    gap: 24px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .scoreboard span { color: var(--accent-dark); }
  .stage {
    position: relative;
    background: var(--panel);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(47, 62, 70, 0.12);
  }
  canvas {
    display: block;
    border-radius: 10px;
    background: var(--grid);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 12px;
    border-radius: 10px;
    background: rgba(47, 62, 70, 0.82);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.4rem; }
  .overlay p { margin: 0; opacity: 0.9; font-size: 0.95rem; }
  button {
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(0.96); }
  .hint {
    font-size: 0.85rem;
    opacity: 0.7;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>
  <h1>Snake<span class="dot">.</span></h1>
  <div class="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>

  <div class="stage">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready to play?</h2>
      <p id="overlay-text">Eat the apples, avoid the walls and yourself.</p>
      <button type="button" id="start-btn">Start Game</button>
    </div>
  </div>

  <p class="hint">Use the arrow keys or WASD on a keyboard, or swipe on a touchscreen. Press Space to pause.</p>

<script>
(function () {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayText = document.getElementById("overlay-text");
  const startBtn = document.getElementById("start-btn");

  const CELLS = 20;
  const CELL = canvas.width / CELLS;
  const STEP_MS = 130;

  let snake, dir, nextDir, food, score, best, running, paused, lastTick, loopId;

  best = Number(localStorage.getItem("snake-best") || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    while (true) {
      const p = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
      if (!snake.some((s) => s.x === p.x && s.y === p.y)) {
        food = p;
        return;
      }
    }
  }

  function startGame() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add("hidden");
    lastTick = performance.now();
    cancelAnimationFrame(loopId);
    loopId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem("snake-best", String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = "Game over";
    overlayText.textContent = "You scored " + score + ". Nice run!";
    startBtn.textContent = "Play Again";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Take your time.";
      startBtn.textContent = "Resume";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
      lastTick = performance.now();
      loopId = requestAnimationFrame(loop);
    }
  }

  function loop(now) {
    if (!running || paused) return;
    loopId = requestAnimationFrame(loop);
    if (now - lastTick < STEP_MS) return;
    lastTick = now;
    tick();
    draw();
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some((s) => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = "rgba(47,62,70,0.04)";
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = "#ef5350";
    roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 5);
    ctx.fill();

    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#388e3c" : "#4caf50";
      roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 6);
      ctx.fill();
    });
  }

  function setDirection(x, y) {
    // prevent reversing directly
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase()) || " " === e.key) {
      e.preventDefault();
    }
    if (k === "arrowup" || k === "w") setDirection(0, -1);
    else if (k === "arrowdown" || k === "s") setDirection(0, 1);
    else if (k === "arrowleft" || k === "a") setDirection(-1, 0);
    else if (k === "arrowright" || k === "d") setDirection(1, 0);
    else if (k === " ") {
      if (running) togglePause();
      else startGame();
    }
  });

  // touch / swipe
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener("click", () => {
    if (paused) togglePause();
    else startGame();
  });

  // first paint
  reset();
  draw();
})();
</script>
</body>
</html>
